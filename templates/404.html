{% extends 'base.html' %}

{% block title %}PFMS - Page Not Found{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
<style>
    .error-wrapper {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .error-code {
        font-size: 7rem;
        font-weight: 800;
        background: linear-gradient(135deg, #4cc9f0, #4361ee);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1;
        margin-bottom: 16px;
    }

    .error-title {
        color: #ffffff;
        font-size: 1.4rem;
        font-weight: 600;
        margin-bottom: 10px;
    }

    .error-msg {
        color: rgba(255, 255, 255, 0.4);
        font-size: 0.9rem;
        margin-bottom: 28px;
    }
</style>
{% endblock %}

{% block content %}
{% include 'navbar.html' %}
<div class="error-wrapper">
    <div>
        <div class="error-code">404</div>
        <div class="error-title">Page Not Found</div>
        <div class="error-msg">The page you're looking for doesn't exist.</div>
        <a href="{{ url_for('dashboard.index') }}" class="btn-income">
            <i class="bi bi-house me-2"></i>Back to Dashboard
        </a>
    </div>
</div>
{% endblock %}
